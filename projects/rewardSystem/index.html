<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Rewards App</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- React and ReactDOM via CDN -->
        <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <!-- Babel for JSX support -->
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                background-color: #f0f0f0;
            }
            h1 {
                color: #333;
            }
            #root {
                padding: 20px;
                background-color: #fff;
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            input[type="button"] {
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                background-color: #007BFF;
                color: white;
                border: none;
                border-radius: 5px;
            }
            input[type="button"]:hover {
                background-color: #0056b3;
            }
            .smaller-text {
                font-size: 0.9em;
                color: #555;
            }
            label {
                margin-left: 8px;
            }
            input[type="text"], input[type="number"] {
                margin-top: 10px;
                padding: 5px;
                width: 10em;
            }
            .unselectable {
                -webkit-user-select: none; /* Safari */
                -ms-user-select: none; /* IE 10 and IE 11 */
                user-select: none; /* Standard syntax */
            }
            .popup {
                border: 2px solid #007BFF;
                padding: 10px;
                background-color: #e9f5ff;
                border-radius: 5px;
                position: absolute;
                width: 25%;
                margin-left: 37.5%;
                left: 0;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="text/babel">
            let weightings = {0: 1, 1: 0.5, 2: 0.2, 3: 0.05};
            let rewardsGiven = 0;
            let maxRewardsToGive = "";
            let maxAchievementsToReward = "";
            let timesRolled = 0;
            let rewardName = "";
            let currentReward = 0;
            let extremeness = 50;
            function handleClick() {
                rewardName = String(document.getElementById('rewardName').value);
                maxRewardsToGive = Number(document.getElementById('rewardUnits').value);
                maxAchievementsToReward = Number(document.getElementById('maxRewardsGiven').value);
                extremeness = Number(document.getElementById('extremeness').value);

                if (rewardName === "" || maxRewardsToGive === "" || maxAchievementsToReward === "") {
                    alert("Please fill in all fields.");
                    root.render(<App />);
                    return;
                }

                let remainingRewards = maxRewardsToGive - rewardsGiven;
                let remainingRolls = maxAchievementsToReward - timesRolled;
                let rewardToRollRatio = remainingRewards / remainingRolls;

                if (remainingRolls <= 0) {
                    weightings = {0: 1, 1:0, 2: 0, 3: 0};
                }
                if (rewardToRollRatio >= 2) {
                    weightings = {0: (1-rewardToRollRatio/3)*extremeness/100, 1:0, 2: (1-(rewardToRollRatio-2))*(1-extremeness/100), 3: (rewardToRollRatio-2)*(1-extremeness/100)+(rewardToRollRatio/3)*extremeness/100};

                }
                else if (rewardToRollRatio >= 1) {
                    weightings = {0: (1-rewardToRollRatio/3)*extremeness/100, 1:(1-(rewardToRollRatio-1))*(1-extremeness/100), 2: (rewardToRollRatio-1)*(1-extremeness/100), 3: (rewardToRollRatio/3)*extremeness/100};
                }
                else {
                    weightings = {0: (1-rewardToRollRatio)*(1-extremeness/100)+(rewardToRollRatio/3)*extremeness/100, 1:rewardToRollRatio*(1-extremeness/100), 2: 0, 3: (rewardToRollRatio/3)*extremeness/100};
                }
                console.log(weightings);
                console.log(0 + weightings[1]*remainingRolls + 2*weightings[2]*remainingRolls + 3*weightings[3]*remainingRolls);

                let randomRoll = Math.random()
                if (randomRoll< weightings[0]) {
                    currentReward = 0
                }
                else if (randomRoll < weightings[0] + weightings[1]) {
                    currentReward = 1
                }
                else if (randomRoll < weightings[0] + weightings[1] + weightings[2]) {
                    if (remainingRewards < 2) {
                        currentReward = remainingRewards
                    }
                    else {
                        currentReward = 2
                    }
                }
                else {
                    if (remainingRewards < 3) {
                        currentReward = remainingRewards
                    }
                    else {
                        currentReward = 3
                    }
                }   
                
                rewardsGiven += currentReward;
                timesRolled++;
                root.render(<HandleClick />);
                return
            }

            function HandleClick() {
                return (
                    <div>
                        <div className="popup">
                            <h2>Reward Details</h2>
                            <p>Your reward is: {currentReward} {rewardName}</p>
                            <input type="button" value="Close" onClick={() => root.render(<App />)} />
                        </div>
                        <h1>Rewards System</h1>
                        <p>Welcome to the Randomised Rewards App!</p>
                        <br></br>
                        <p>Settings</p>
                        <div className="smaller-text">
                            <input type="text" id="rewardName" defaultValue={rewardName} />
                            <label htmlFor="rewardName">Name of the reward (I.e. chocolate squares)</label>
                            <br></br>
                            <input type="number" id="rewardUnits" defaultValue={maxRewardsToGive} />
                            <label htmlFor="rewardUnits">Total reward units that can be given (I.e. how many chocolate squares should be given at most throughout)</label>
                            <br></br>
                            <input type="number" id="maxRewardsGiven" defaultValue={maxAchievementsToReward} />
                            <label htmlFor="maxRewardsGiven">Maximum rewards that can be given (I.e. how many times an achievement can occur)</label>
                            <br></br>
                            <input type="range" id="extremeness" defaultValue={extremeness} min="0" max="100" />
                            <label htmlFor="extremeness">Extremeness of the reward (I.e. How much disparity there is between rewards) (least -> most)</label>
                        </div>
                        <br></br>
                        <p>Click the button below to roll the dice and see the reward for your achievement!</p>
                        <input type="button" value="Roll the Dice!" onClick={handleClick} />
                    </div>
                );       
            }
            function App() {
                return (
                    <div>
                        <h1>Rewards System</h1>
                        <p>Welcome to the Randomised Rewards App!</p>
                        <br></br>
                        <p>Settings</p>
                        <div className="smaller-text">
                            <input type="text" id="rewardName" defaultValue={rewardName} />
                            <label htmlFor="rewardName">Name of the reward (I.e. chocolate squares)</label>
                            <br></br>
                            <input type="number" id="rewardUnits" defaultValue={maxRewardsToGive} />
                            <label htmlFor="rewardUnits">Total reward units that can be given (I.e. how many chocolate squares should be given at most throughout)</label>
                            <br></br>
                            <input type="number" id="maxRewardsGiven" defaultValue={maxAchievementsToReward} />
                            <label htmlFor="maxRewardsGiven">Maximum rewards that can be given (I.e. how many times an achievement can occur)</label>
                            <br></br>
                            <input type="range" id="extremeness" defaultValue={extremeness} min="0" max="100" />
                            <label htmlFor="extremeness">Extremeness of the reward (I.e. How much disparity there is between rewards) (least -> most)</label>
                        </div>
                        <br></br>
                        <p>Click the button below to roll the dice and see the reward for your achievement!</p>
                        <input type="button" value="Roll the Dice!" onClick={handleClick} />
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
           
        </script>
    </body>
</html>
