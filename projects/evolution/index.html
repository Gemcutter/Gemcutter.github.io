<html>
    <head>
        <title>Evolution V6</title>
        <script src="script.js" type="text/javascript"></script>
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" type="image/x-icon" href="icon.png" />
    </head>
    <body>
        <h1>Evolution Version 6</h1>
        <div class="container">
            <div>
                <button onclick="run()">run</button>
                <button onclick="pausePlay()">pause/play</button>
                <h4>Population: </h4>
                <p id="population"></p>
            </div>
            
            <canvas id="myCanvas" width="500px" height="500px"></canvas>
            <select id="select" onchange="creature.logData(true)">
                <option>Pick a species to view</option>
                <option>0</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
            </select>
        </div>
        <table id="output"></table>
    </body>
</html>
