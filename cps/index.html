<!DOCTYPE html>
<html>
    <head>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="crossorigin="anonymous"> </script>
        <style>
            div {
                border: 5px, black, solid;
                width: 50svw;
                height: 50svh;
                margin: auto;
                margin-top: calc(25svh - 5px);
            }
        </style>
        <script>
            clicks = 0;
            timeStart = null;
            $(document).ready(function() {
                $("#box").click(function() {
                    if (timeStart==null) {
                        timeStart = new Date()
                        
                        console.log(timeStart)
                    }
                    else  {
                        timeEnd = new Date()
                        clicks++
                        cps = clicks/((timeEnd-timeStart)/1000)*60
                        console.log(cps)
                        $("#output").html(cps)
                    }
                })
            })
            
        </script>
    </head>
    <body>
        <div id="box">
            
        </div>
        <p>
            Your clicks per second is: <span id="output">0</span>
        </p>
    </body>
</html>
