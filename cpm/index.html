<!DOCTYPE html>
<html>
    <head>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="crossorigin="anonymous"> </script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            html, body {
                font-family: Arial, sans-serif;
            }
            #box {
                border: 5px, black, solid;
                max-width: 75svw;
                max-height: 75svh;
                width: 75svw;
                height: 75svh;
                margin-left: 12.5svw;
            }
            p,h1 {
                text-align: center;
            }
        </style>
        <script>
            clicks = {
                cpm:[],
                time:[]
            };
            clickCount = 0
            timeStart = null;
            prevTimeEnd = null;
            timeEnd = null;
            let myChart = null;
            $(document).ready(function() {
                const ctx = document.getElementById('box');
                $("#box").click(function() {
                    if (timeStart==null) {
                        timeStart = new Date()
                        console.log(timeStart)
                    }
                    else  {
                        prevTimeEnd = timeEnd;
                        timeEnd = new Date()
                        clickCount++
                        cpm = clickCount/((timeEnd-timeStart)/1000)*60
                        if (prevTimeEnd!=null) {
                            cpm2 = 1/((timeEnd-prevTimeEnd)/1000)*60
                        }
                        else {
                            cpm2 = 1/((timeEnd-timeStart)/1000)*60
                        }
                        clicks["cpm"].push(cpm2)
                        clicks["time"].push((timeEnd-timeStart)/1000)
                        if (myChart!=null) {
                            myChart.destroy()
                        }
                        $("#output").html(cpm)
                        myChart = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: clicks["time"],
                                datasets: [{
                                    label: 'CPM over time',
                                    data: clicks["cpm"],
                                    fill: false,
                                    borderColor: 'rgb(75, 192, 192)',
                                    tension: 0.1
                                }]
                            }
                        });
                    }
                })
            })
            
        </script>
    </head>
    <body>
        <h1>Heart Rate Tracker</h1>
        <canvas id="box" width="300px" height="200px"></canvas>
        <p>
            Your beats per minute is: <span id="output">0</span>
        </p>
    </body>
</html>
