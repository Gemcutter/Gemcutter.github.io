<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grade Calculator</title>
    <script>
        let rowsMade = 0
        let desiredGrade = 50
        let dataTypes = []
        function run() {
            document.getElementById('calculate').addEventListener('click', ()=>{
                let table = document.getElementById("assessments")
                let rows = table.childNodes
                let details = []
                for (let i in rows) {
                    if (rows[i].id != undefined) {
                        rowId = rows[i].id
                        let name = document.getElementById("col1"+rowId).value
                        let weighting = parseFloat(document.getElementById("col2"+rowId).value)
                        let score = document.getElementById("col3"+rowId).value
                        if (score.includes("/")&&!Number.isNaN(weighting)) {
                            let numerator = score.split('/')[0]
                            let denominator = score.split('/')[1]
                            score = numerator/denominator*100
                        }
                        else if (dataTypes[rowId]==="Marks"&&!Number.isNaN(score)&&!Number.isNaN(weighting)) {
                            score = score/weighting*100
                        }
                        else {
                            score = parseFloat(score)
                        }
                        if (Number.isNaN(score)) {
                            score=''
                        }
                        if (Number.isNaN(weighting)) {
                            weighting=''
                        }
                        details.push(new Assessment(name, weighting, score))
                    }
                }
                console.log(details)
                let totalComplete = 0
                let totalEarned = 0
                for (let i in details) {
                    if (details[i].assessmentValue!= undefined) {
                        totalComplete += details[i].weighting
                        totalEarned += details[i].assessmentValue
                    }
                }
                let requiredRemaining = desiredGrade/100-totalEarned
                let requiredAverage = requiredRemaining/(1-totalComplete)
                if (totalEarned>=desiredGrade/100) {
                    document.getElementById("results").innerText = "You have already achieved your goal grade"
                }
                else if (requiredAverage>1) {
                    document.getElementById("results").innerText = "You cannot acheive your goal grade"
                }
                else {
                    document.getElementById("results").innerText = "You need to get an average of "+round(requiredAverage*100, 2)+"% in your remaining assessments"
                }
                
            })
            
            document.getElementById('newRow').addEventListener('click', ()=>{
                let table = document.getElementById("assessments")
                let row = document.createElement("tr")
                let rowNum = rowsMade
                row.id = rowNum
                let col1 = document.createElement("td")
                let col1input = document.createElement("input")
                col1input.id = "col1"+rowNum
                col1.appendChild(col1input)
                row.appendChild(col1)
                let col2 = document.createElement("td")
                let col2input = document.createElement("input")
                col2input.id = "col2"+rowNum
                col2.appendChild(col2input)
                row.appendChild(col2)
                let col3 = document.createElement("td")
                let col3input = document.createElement("input")
                col3input.id = "col3"+rowNum
                col3.appendChild(col3input)
                row.appendChild(col3)
                let col4 = document.createElement("td")
                let col4btn1 = document.createElement("button")
                col4btn1.innerText = "Delete Row"
                col4btn1.addEventListener('click', ()=>{deleteRow(rowNum)})
                col4.appendChild(col4btn1)
                let col4btn2 = document.createElement("button")
                col4btn2.innerText = "Percentage"
                col4btn2.addEventListener('click', ()=>{toggleInputType(col4btn2, rowNum)})
                col4.appendChild(col4btn2)
                row.appendChild(col4)
                table.appendChild(row)
                dataTypes.push('Percentage')
                rowsMade++
                
            })
            document.getElementById('desiredGrade').addEventListener('change', ()=>{
                desiredGrade = document.getElementById('desiredGrade').value
            })
            
        }
        function round(n, digits) {
            let multiplier = Math.pow(10,digits)
            if (n%1>0.5) {
                return Math.ceil(multiplier*n)/multiplier
            }
            return Math.floor(multiplier*n)/multiplier
        }
        function deleteRow(rowID) {
            document.getElementById(rowID).remove()
            delete dataTypes[rowID]
        }
        function toggleInputType(button, rowIdx) {
            let currentType = button.innerText
            if (currentType==="Percentage") {
                button.innerText = "Marks"
            }
            else {
                button.innerText = "Percentage"
            }
            currentType = button.innerText
            dataTypes[rowIdx] = currentType
        }
        class Assessment {
                constructor(name, weighting, score) {
                    this.name = name
                    this.weighting = this.parsePercentage(weighting)
                    this.score = this.parsePercentage(score)
                    this.assessmentValue = undefined
                    if (score !== "") {
                        this.assessmentValue = this.parsePercentage(weighting)*this.parsePercentage(score)
                    }                    
                }
                parsePercentage(percentage) {
                    if (percentage[percentage.length-1]=="%") {
                        percentage = percentage.slice(0,percentage.length-1)
                    }
                    let int = parseFloat(percentage)
                    return int/100
                }
            }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
            background-color: #d4ffff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            background-color: white;
        }
        th {
            background-color: #f2f2f2;
        }
        input {
            width: 4em;
        }
        button {
            padding: 10px 15px;
            cursor: pointer;
        }
        table {
            max-width: max-content;
            margin-left: auto;
            margin-right: auto;
        }
        #results {
            margin-top: 20px;
            color: green;
        }
    </style>
</head>
<body onload="run()">
    <h1>Grade Calculator</h1>
    <p>Welcome to the Grade Calculator!</p>
    <label for="desiredGrade">Desired Grade: </label>
    <input id="desiredGrade" value="50">
    <br>
    <br>
    <button id="newRow">Add Assessment</button>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Weighting</th>
                <th>Score</th>
                <th>functions</th>
            </tr>
        </thead>
        <tbody id="assessments">

        </tbody>
    </table>
    <br>
    <button id="calculate">Calculate</button>
    <h1 id="results"></h1>
</body>
</html>
